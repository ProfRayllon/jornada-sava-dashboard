<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistema · Jornada SAVA</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Tema único do sistema (vale também para o painel) e lateral recolhida, aplicados antes de desenhar.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("jornada-sava-theme") || "light";
        if (localStorage.getItem("jornada-sava-lateral") === "recolhida") document.documentElement.classList.add("side-collapsed");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="assets/css/sistema.css?v=2" />
    <script src="base/dados-painel.js" defer></script>
    <script src="assets/js/regras.js" defer></script>
    <script src="assets/js/store.js" defer></script>
    <script src="assets/js/sistema.js?v=2" defer></script>
  </head>
  <body class="app-page">
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="side-top">
          <a class="side-brand" href="index.html" title="Ir para o site">
            <img class="side-logo" src="assets/logo/sava-logo.png" alt="Sebadelhe Aranha & Vasconcelos Advocacia" />
            <img class="side-symbol" src="assets/logo/sava-simbolo.png" alt="" />
          </a>
          <button class="side-collapse" id="collapseBtn" type="button" aria-label="Recolher menu" title="Recolher menu"></button>
        </div>
        <div class="side-user" id="sideUser"></div>
        <nav class="side-nav" id="sideNav" aria-label="Seções do sistema"></nav>
        <div class="side-foot" id="sideFoot"></div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Abrir menu">☰</button>
          <div>
            <p class="topbar-kicker" id="viewKicker">Jornada SAVA</p>
            <h1 id="viewTitle">Visão geral</h1>
          </div>
        </header>
        <main class="content" id="content"></main>
      </div>
    </div>

    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-head">
          <h2 id="modalTitle"></h2>
          <button class="icon-btn" type="button" data-close aria-label="Fechar">×</button>
        </header>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-backdrop" data-close-drawer></div>
      <div class="drawer-panel" id="drawerPanel" role="dialog" aria-modal="true"></div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
